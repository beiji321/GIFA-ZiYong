<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>方位标记</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    body.placing { -webkit-app-region: drag; cursor: move; }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <script>
    // 两套渲染各自独立成文件，互不干扰：
    //   overlay.js —— 上游原版（圆环 + 箭头）
    //   radar.js   —— 魔改扩展（四轴罗盘 + 字幕方位点亮 + 自绘拖动）
    // 由主进程通过 ?radar=1 指定用哪套。
    (function () {
      var radar = /(?:^|[?&])radar=1(?:&|$)/.test(location.search);
      var el = document.createElement('script');
      el.src = radar ? './radar.js' : './overlay.js';
      /* 动态插入的脚本是异步执行的，可能晚于页面 load 事件。
       * 主进程在 did-finish-load 时发的 radar:config 会因此早一步到达，
       * 那时监听还没注册，消息直接丢掉 —— radar.js 就一直认为「不可见」，
       * 字幕里的方位全被丢弃，表现就是雷达怎么都不亮。
       * 这里等脚本真正执行完，再让主进程补发一次全部配置。 */
      el.onload = function () {
        try {
          if (window.overlayApi && window.overlayApi.ready) window.overlayApi.ready();
        } catch (e) {
          /* 握手失败时主进程还有 did-finish-load 那一发兜底 */
        }
      };
      document.body.appendChild(el);
    })();
  </script>
</body>
</html>
