<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>方位标记</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
      user-select: none;
    }
    canvas { display: block; width: 100%; height: 100%; }
    body.placing { -webkit-app-region: drag; cursor: move; }
  </style>
</head>
<body>
  <canvas id="cv"></canvas>
  <script>
    // 两套渲染各自独立成文件，互不干扰：
    //   overlay.js —— 上游原版（圆环 + 箭头）
    //   radar.js   —— 魔改扩展（四轴罗盘 + 字幕方位点亮 + 自绘拖动）
    // 由主进程通过 ?radar=1 指定用哪套。
    (function () {
      var radar = /(?:^|[?&])radar=1(?:&|$)/.test(location.search);
      var el = document.createElement('script');
      el.src = radar ? './radar.js' : './overlay.js';
      document.body.appendChild(el);
    })();
  </script>
</body>
</html>
